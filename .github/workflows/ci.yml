name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing in this workflow writes to the repository, so the token starts with no
# permissions at all and each job asks only for what it reads.
permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` also runs the api's postinstall, which generates the Prisma client
      # that both the api and the worker typecheck against.
      - run: npm ci

      - run: npm run lint

      - run: npm run format:check

      - run: npm run typecheck

      - run: npm test

      - run: npm run build
